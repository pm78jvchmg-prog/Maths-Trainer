# Gives ONE pull request a fresh commit when Cloudflare has stopped building.
#
# READ THIS BEFORE LOWERING THE THRESHOLD. Cloudflare builds one head at a
# time, in the order pushes arrive, and posts the "Workers Builds:
# maths-trainer" check only when a build is under way or done. With a dozen
# pull requests open a head can wait well over twenty minutes and be perfectly
# healthy. Pushing to such a head (merging main in) puts the new head at the
# BACK of the queue, so an eager "stuck" job makes every wait longer and the
# queue never drains. That is what this job used to do on 2026-09-25, with 12
# to 16 pull requests open: it re-kicked every PR queued over twenty minutes.
#
# So it now acts only on a real stall of the build system as a whole:
#
# 1. Alive check. It looks at the Cloudflare check runs on main's head, every
#    open pull request's head, and the heads of the most recently updated pull
#    requests of any state (a landed one keeps its build on its own head; main's
#    merge commit carries none). If any run started or finished in the last
#    twenty minutes, Cloudflare is working through the queue and the job exits
#    without touching anything.
# 2. Only if nothing has moved for twenty minutes anywhere, and some open,
#    non-draft pull request's head has had only a queued Cloudflare suite for
#    over twenty minutes, it re-kicks the single OLDEST such pull request: it
#    merges main into it (GitHub's "Update branch"), a real commit rather than an
#    empty one, which gets a build of its own. One push, so the rest of the
#    queue keeps its order. The next run takes the next one if still stalled.
#
# Now and then Cloudflare really does accept a push and never build it (four of
# about sixty pushes on 2026-09-23); with nothing else in the queue that shows
# up as exactly the stall in step 2.
#
# The update is pushed with this workflow's GITHUB_TOKEN, and GitHub does not
# start `pull_request` workflows for a push made with that token, so the new
# head would never get a "Fast checks" run. workflow_dispatch is the one
# exception GitHub makes, so once the head has moved this starts checks.yml on
# the branch by hand; its job reports as "Fast checks" on that commit.
#
# Runs every thirty minutes (each run bills at least a minute on a private
# repository). Run it by hand (workflow_dispatch) to check sooner; tick
# "dry run" to see what it would decide without pushing anything.

name: Stuck builds

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what it would do; push nothing
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  # To start checks.yml by workflow_dispatch after updating a branch.
  actions: write

jobs:
  update-branch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      STALL_SECONDS: 1200
    steps:
      # Only for the script: it lives in a file so it can be dry-run locally.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Re-kick the oldest queued pull request if Cloudflare has stalled
        run: bash .github/scripts/stuck-builds.sh
