<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- viewport-fit=cover lets the safe-area insets in index.css do their job
         on a notched iPhone once installed to the Home Screen. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <meta name="theme-color" content="#11121a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black`, not `black-translucent`. On iOS 26 and later a translucent
         status bar gives the page a window a status bar short of the screen,
         placed sometimes at the top and sometimes below the status bar, while
         still reporting the top safe-area inset: the home screen opened on a
         59pt dark strip and then 59pt of empty padding under it. With `black`
         the page always starts below the status bar and the inset is 0. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Excellent" />
    <title>Excellent</title>
    <!-- The splash is what shows while the bundle downloads and parses, which
         on a phone is long enough to see; an empty #root is a blank screen.
         React empties #root on its first render, so nothing removes it by
         hand. Styled here rather than in index.css so it needs no bundle. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: #f3f3f8;
        text-align: center;
      }
      #splash .splash-name {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      #splash .splash-note {
        font-size: 15px;
        color: #9ba2bb;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash" role="status">
        <div class="splash-name">Excellent</div>
        <div class="splash-note">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
